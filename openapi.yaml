  /audit-webhooks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      summary: Update webhook
      responses:
        "200": { description: Updated }
    delete:
      summary: Delete webhook
      responses:
        "204": { description: Deleted }

  /audit-logs:
    get:
