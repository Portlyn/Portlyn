openapi: 3.0.3
info:
  title: Portlyn Admin API
  version: "1.0.0"
  description: |
    Administrative and operational API for Portlyn, a self-hosted reverse proxy
    and zero-trust control plane. All endpoints under `/api/v1` require a valid
    session cookie or `Authorization: Bearer <token>` header unless documented
    as public.
  license:
    name: TBD
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: portlyn.example.com
        description: Your Portlyn deployment host

security:
  - bearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: portlyn_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            status: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, viewer] }
        active: { type: boolean }
        mfa_enabled: { type: boolean }
        auth_provider: { type: string, enum: [local, oidc] }
        created_at: { type: string, format: date-time }
    AccessPolicy:
      type: object
      description: Nested access policy, identical shape on request and response.
      required: [access_mode]
      properties:
        access_mode: { type: string, enum: [public, authenticated, restricted] }
        allowed_roles:
          type: array
          items: { type: string }
        allowed_groups:
          type: array
          items: { type: integer }
        allowed_service_groups:
          type: array
          items: { type: integer }
    ServiceCreate:
      type: object
      description: Request body for creating/updating/upserting a service.
      required: [name, domain_id, path, target_url, tls_mode, access_policy]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        domain_id: { type: integer }
        subdomain: { type: string }
        path: { type: string }
        target_url:
          type: string
          format: uri
          description: Upstream target. The scheme (http/https) determines the upstream leg; tls_mode only controls the edge.
        tls_mode:
          type: string
          enum: [offload, passthrough, none]
          description: Edge TLS behavior (the browser-facing leg), NOT the upstream connection.
        pass_host_header: { type: boolean }
        upstream_skip_verify:
          type: boolean
          description: Disable upstream certificate verification. Prefer upstream_ca_pem for pinning.
        upstream_ca_pem:
          type: string
          description: PEM CA bundle to verify the upstream against (safer than upstream_skip_verify).
        upstream_server_name:
          type: string
          description: TLS ServerName to verify the upstream certificate against. Defaults to the target_url host; set this when the backend cert name differs from the dial host (e.g. when routing over the tunnel).
        access_policy: { $ref: "#/components/schemas/AccessPolicy" }
        access_method:
          type: string
          enum: ["", session, oidc_only, pin, email_code]
        node_id: { type: integer, nullable: true }
        node:
          type: string
          description: Reference a site/node by name instead of node_id (resolved server-side). Ignored if node_id is set.
    Service:
      type: object
      description: Service response. Includes the nested access_policy (mirroring the request) plus flat fields for backward compatibility and read-only derived fields.
      properties:
        id: { type: integer }
        name: { type: string }
        domain_id: { type: integer }
        subdomain: { type: string }
        hostname: { type: string, description: Fully-qualified host the service is served on }
        path: { type: string }
        target_url: { type: string, format: uri }
        tls_mode: { type: string, enum: [offload, passthrough, none] }
        tls:
          type: object
          description: Disambiguated TLS legs.
          properties:
            edge: { type: string, enum: [offload, passthrough, none] }
            upstream:
              type: object
              properties:
                scheme: { type: string, enum: ["", http, https] }
                skip_verify: { type: boolean }
                ca_pinned: { type: boolean }
                server_name: { type: string }
        pass_host_header: { type: boolean }
        upstream_skip_verify: { type: boolean }
        upstream_ca_configured: { type: boolean }
        access_policy: { $ref: "#/components/schemas/AccessPolicy" }
        access_mode: { type: string, enum: [public, authenticated, restricted] }
        access_method:
          type: string
          enum: ["", session, oidc_only, pin, email_code]
        risk_score: { type: string, enum: [low, medium, high] }
        risk_reasons:
          type: array
          items: { type: string }
        active_cert_source:
          type: string
          enum: [managed, static, bootstrap, none]
          description: Which certificate the edge actually serves for this host. `bootstrap` means only the short-lived self-signed cert is present.
        active_cert_issuer: { type: string }
        active_cert_expires: { type: string, format: date-time, nullable: true }
        active_cert_is_bootstrap: { type: boolean }
        active_cert_days_remaining: { type: integer }
        service_status: { type: string, enum: [pending, healthy, unhealthy] }
        node_id:
          type: integer
          nullable: true
          description: If set, traffic to this service is routed via the WireGuard tunnel to this node
        allowed_countries:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
        blocked_countries:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
        ip_allowlist:
          type: array
          items: { type: string }
        ip_blocklist:
          type: array
          items: { type: string }
    Domain:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: FQDN; unique key used by PUT upsert }
        type: { type: string, enum: [root, subdomain] }
        provider: { type: string }
        notes: { type: string }
        ip_allowlist: { type: array, items: { type: string } }
        ip_blocklist: { type: array, items: { type: string } }
    DomainCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [root, subdomain] }
        provider: { type: string }
        notes: { type: string }
        ip_allowlist: { type: array, items: { type: string } }
        ip_blocklist: { type: array, items: { type: string } }
        auto_certificate:
          type: boolean
          default: true
          description: When true (default) and a single active DNS provider exists, a dns-01 Let's Encrypt certificate is requested automatically. The created certificate id is returned in the X-Portlyn-Auto-Certificate-Id response header.
        dns_provider_id:
          type: integer
          description: Explicit DNS provider to use for auto-issuance instead of auto-selecting.
    Certificate:
      type: object
      properties:
        id: { type: integer }
        domain_id: { type: integer }
        primary_domain: { type: string }
        type: { type: string, enum: [single, wildcard, multi_san] }
        status: { type: string, enum: [pending, issued, failed, expiring_soon, renewing] }
        last_error: { type: string }
        challenge_type: { type: string, enum: [http-01, dns-01] }
        issuer: { type: string, enum: [letsencrypt_prod, letsencrypt_staging] }
        issued_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }
        next_renewal_at: { type: string, format: date-time, nullable: true }
        is_auto_renew: { type: boolean }
        dns_provider_id: { type: integer, nullable: true }
    CertificateCreate:
      type: object
      required: [domain_id, type, challenge_type, issuer]
      properties:
        domain_id: { type: integer }
        type: { type: string, enum: [single, wildcard, multi_san] }
        challenge_type: { type: string, enum: [http-01, dns-01] }
        issuer: { type: string, enum: [letsencrypt_prod, letsencrypt_staging] }
        primary_domain: { type: string }
        sans: { type: array, items: { type: string } }
        is_auto_renew: { type: boolean }
        renewal_window_days: { type: integer, minimum: 7, maximum: 90 }
        dns_provider_id: { type: integer }
    DNSProvider:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [cloudflare, hetzner, route53, digitalocean] }
        is_active: { type: boolean }
        config_hint: { type: string }
        has_stored_secret: { type: boolean }
        last_test_status: { type: string }
        supported_challenges: { type: array, items: { type: string } }
    DNSProviderCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [cloudflare, hetzner, route53, digitalocean] }
        is_active: { type: boolean }
        config:
          type: object
          additionalProperties: { type: string }
          description: Provider credentials (e.g. api_token). Stored encrypted, never returned.
    Node:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [unknown, online, offline] }
        wg_public_key: { type: string }
        wg_tunnel_ip: { type: string }
        wg_endpoint: { type: string }
        tunnel_status:
          type: string
          enum: [inactive, provisioned, connected, stale]
    TunnelBootstrapResponse:
      type: object
      properties:
        node_id: { type: integer }
        public_key: { type: string }
        private_key:
          type: string
          description: Shown only once. Store it on the agent side immediately.
        address: { type: string }
        server_public_key: { type: string }
        server_endpoint: { type: string }
        allowed_ips:
          type: array
          items: { type: string }
        config_text:
          type: string
          description: A ready-to-paste wg-quick config
    ExposureReport:
      type: object
      properties:
        service_id: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100 }
        checked_at: { type: string, format: date-time }
        dns_resolvable: { type: boolean }
        https_valid: { type: boolean }
        https_expires_in_days: { type: integer }
        http_to_https_redirect: { type: boolean }
        hsts_present: { type: boolean }
        csp_present: { type: boolean }
        x_frame_options: { type: boolean }
        auth_enforced: { type: boolean }
        findings:
          type: array
          items: { type: string }
    AuditWebhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string, format: uri }
        format: { type: string, enum: [generic, slack, discord, ntfy] }
        event_types:
          type: array
          items: { type: string }
        active: { type: boolean }
        last_status: { type: integer }
        last_fired_at: { type: string, format: date-time, nullable: true }
    UserCredential:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        credential_id: { type: string }
        sign_count: { type: integer }
        user_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    MagicLinkResponse:
      type: object
      properties:
        url: { type: string, format: uri }
        token: { type: string }
        expires_at: { type: string, format: date-time }

    Group:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    ServiceGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        default_access_policy: { $ref: "#/components/schemas/AccessPolicy" }
        access_method: { type: string, enum: [session, oidc_only, pin, email_code] }
        service_ids:
          type: array
          items: { type: integer }
    APIToken:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        role: { type: string, enum: [admin, viewer] }
        status: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Client:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        wg_public_key: { type: string }
        wg_tunnel_ip: { type: string }
        created_at: { type: string, format: date-time }
    ClientConfig:
      type: object
      properties:
        client: { $ref: "#/components/schemas/Client" }
        config_text: { type: string, description: Ready-to-paste wg-quick config }
        address: { type: string }
        allowed_ips:
          type: array
          items: { type: string }
    Session:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

paths:
  /auth/login:
    post:
      summary: Email + password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Session issued
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limited }

  /auth/config:
    get:
      summary: Public auth configuration for the login page
      security: []
      responses:
        "200":
          description: Which login methods are enabled, plus branding
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidc_enabled: { type: boolean }
                  oidc_label: { type: string }
                  otp_enabled: { type: boolean }
                  local_login_disabled: { type: boolean }
                  ui: { type: object }

  /auth/logout:
    post:
      summary: End the current session
      responses:
        "200": { description: Session revoked }

  /auth/refresh:
    post:
      summary: Exchange a refresh cookie for a new access token
      security: []
      responses:
        "200": { description: New token issued }
        "401": { description: Refresh token missing, expired or revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/verify-mfa:
    post:
      summary: Complete a login that asked for a second factor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string, description: Short lived token from the login response }
                code: { type: string, description: TOTP code or recovery code }
      responses:
        "200": { description: Session issued }
        "401": { description: Invalid or replayed code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limited }

  /auth/request-otp:
    post:
      summary: Email a one-time login code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Code sent if the account exists }
        "429": { description: Rate limited }

  /auth/verify-otp:
    post:
      summary: Redeem a one-time login code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string }
      responses:
        "200": { description: Session issued }
        "401": { description: Invalid or expired code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/passkey/begin-login:
    post:
      summary: Start a WebAuthn login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Assertion challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  options: { type: object }
                  expires_at: { type: string, format: date-time }

  /auth/passkey/finish-login:
    post:
      summary: Finish a WebAuthn login
      security: []
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Assertion from navigator.credentials.get()
      responses:
        "200": { description: Session issued }
        "401": { description: Assertion rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/break-glass/login:
    post:
      summary: Loopback-only recovery login
      description: |
        Accepts the break-glass token from the server configuration. Only served
        for requests originating on the machine itself, so an SSO outage or a lost
        authenticator cannot lock an operator out permanently.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Session issued }
        "403": { description: Not a loopback request or break-glass disabled }

  /auth/oidc/start:
    get:
      summary: Begin OIDC login redirect
      security: []
      responses:
        "302": { description: Redirect to identity provider }

  /auth/oidc/callback:
    get:
      summary: OIDC redirect target
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session issued }
        "401": { description: State mismatch or provider rejected the code }

  /me:
    get:
      summary: Current user profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }

  /me/password:
    post:
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Password changed }
        "401": { description: Current password is wrong, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/account-setup:
    post:
      summary: Finish first-login setup by setting a real email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Account updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }

  /me/bootstrap/dismiss:
    post:
      summary: Stop showing the setup wizard for this account
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bootstrap_dismissed: { type: boolean }

  /me/mfa:
    get:
      summary: TOTP status for the current user
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  required_for_current_user: { type: boolean }
                  recovery_code_count: { type: integer }

  /me/mfa/setup:
    post:
      summary: Start TOTP enrolment
      responses:
        "200":
          description: Secret and provisioning URI. Not active until confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }

  /me/mfa/enable:
    post:
      summary: Confirm TOTP enrolment with a current code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: Enabled, recovery codes returned once }
        "401": { description: Wrong code, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/mfa/disable:
    post:
      summary: Turn TOTP off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Current TOTP or recovery code }
      responses:
        "200": { description: Disabled }
        "401": { description: Wrong code }

  /me/mfa/recovery-codes:
    post:
      summary: Replace the recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: New codes, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }

  /me/passkeys:
    get:
      summary: List registered passkeys for the current user
      responses:
        "200":
          description: List
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UserCredential" } } } }

  /me/passkeys/{id}:
    delete:
      summary: Remove a passkey
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Removed }
        "404": { description: Not found }

  /sessions:
    get:
      summary: List the current user's active sessions
      responses:
        "200": { description: List }

  /sessions/{id}:
    delete:
      summary: Revoke one session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Revoked }
        "404": { description: Not found }

  /sessions/revoke-all:
    post:
      summary: Revoke every session of the current user except this one
      responses:
        "200": { description: Revoked }

  /me/passkeys/begin-registration:
    post:
      summary: Begin WebAuthn credential registration
      responses:
        "200":
          description: Challenge options
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  options: { type: object }
                  expires_at: { type: string, format: date-time }

  /me/passkeys/finish-registration:
    post:
      summary: Finalize WebAuthn registration
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: label
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Attestation response from navigator.credentials.create()
      responses:
        "201":
          description: Credential stored
          content: { application/json: { schema: { $ref: "#/components/schemas/UserCredential" } } }

  /services:
    get:
      summary: List services
      responses:
        "200":
          description: List
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } }
    post:
      summary: Create service (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } }
    put:
      summary: Upsert service by route (admin only)
      description: Idempotent apply keyed on (domain_id, subdomain, path). Creates when absent, updates in place when present. A repeated apply is a no-op update, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
