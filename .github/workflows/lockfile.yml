name: Refresh lockfile

# npm on Windows drops the optional platform packages that linux needs, which
# leaves package-lock.json out of sync and breaks npm ci on the runner. Run this
# after changing frontend dependencies and commit the artifact.

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Resolve the dependency tree
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify the lockfile installs cleanly
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock
          path: frontend/package-lock.json
          retention-days: 7
