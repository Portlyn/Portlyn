name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Nothing is published until every gate passes on the commit being tagged.
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  container-security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-security.yml

  build-release:
    needs: [ci, security, codeql, container-security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          PORTLYN_STATIC_EXPORT=1 npm run build
          rm -rf ../cmd/server/frontend_dist
          mv out ../cmd/server/frontend_dist

      - name: Build server binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/portlyn-$os-$arch$ext" ./cmd/server
          done

      - name: Verify embedded frontend
        run: |
          if ! ls cmd/server/frontend_dist/index.html >/dev/null 2>&1; then
            echo "::error::cmd/server/frontend_dist/index.html missing - server binaries would ship empty UI"
            exit 1
          fi

      - name: Build node agent binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/portlyn-nodeagent-$os-$arch$ext" ./cmd/nodeagent
          done

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: sbom-source.spdx.json
          format: spdx-json
          output-file: dist/sbom-source.spdx.json

      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      # Keep in sync with the pinned cosign in scripts/install-hub.sh.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign checksums (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes dist/checksums.txt \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            --new-bundle-format \
            --bundle dist/checksums.txt.bundle.json

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/portlyn-linux-amd64
            dist/portlyn-linux-arm64
            dist/portlyn-darwin-amd64
            dist/portlyn-darwin-arm64
            dist/portlyn-windows-amd64.exe
            dist/portlyn-windows-arm64.exe
            dist/portlyn-nodeagent-*
            dist/sbom-source.spdx.json
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/checksums.txt.bundle.json

      - name: Upload linux binaries for container builds
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            dist/portlyn-linux-amd64
            dist/portlyn-linux-arm64
            dist/portlyn-nodeagent-linux-amd64
            dist/portlyn-nodeagent-linux-arm64
          retention-days: 1

  publish-backend-image:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/portlyn/portlyn
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          flavor: latest=true

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-nodeagent-image:
    name: Publish Node Agent Image
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/portlyn/portlyn-nodeagent
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          flavor: latest=true

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.nodeagent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=nodeagent
          cache-to: type=gha,mode=max,scope=nodeagent
