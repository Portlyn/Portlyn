name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          out=$(gofmt -l $(find . -type f -name '*.go' -not -path './.gomodcache/*' -not -path './cmd/server/frontend_dist/*'))
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet backend
        run: go vet ./...

      - name: Test backend (race)
        run: go test -race -timeout 5m ./...

      - name: Build backend
        run: go build ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend (dev)
        run: npm run build

      - name: Build frontend (static export)
        run: PORTLYN_STATIC_EXPORT=1 npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: portlyn
          POSTGRES_PASSWORD: portlyn
          POSTGRES_DB: portlyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portlyn -d portlyn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the migration tests against postgres
        env:
          PORTLYN_TEST_POSTGRES_URL: postgres://portlyn:portlyn@localhost:5432/portlyn_test?sslmode=disable
        run: go test ./internal/store/ -run TestPostgres -v -count=1

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Docker Compose wiring
        run: docker compose --env-file .env.docker.example config

      - name: Build server and nodeagent binaries for image
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/portlyn-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/portlyn-nodeagent-linux-amd64 ./cmd/nodeagent

      - name: Build backend image
        run: docker build --build-arg TARGETARCH=amd64 -t portlyn-backend:test .

      - name: Build nodeagent image
        run: docker build --build-arg TARGETARCH=amd64 -f Dockerfile.nodeagent -t portlyn-nodeagent:test .

      - name: Build single-binary image
        run: docker build -t portlyn-single:test -f Dockerfile.single .

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the admin UI into the binary
        run: |
          cd frontend
          npm ci
          PORTLYN_STATIC_EXPORT=1 npm run build
          rm -rf ../cmd/server/frontend_dist
          mv out ../cmd/server/frontend_dist

      - name: Build portlyn
        run: CGO_ENABLED=0 go build -trimpath -o portlyn ./cmd/server

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start a throwaway hub
        run: sh scripts/e2e-hub.sh ./portlyn ./.tmp/e2e

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          PORTLYN_E2E_LIVE: "1"
        run: cd frontend && npm run e2e

      - name: Collect hub log on failure
        if: failure()
        run: tail -n 200 .tmp/e2e/hub.log || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  single-binary:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static frontend
        run: |
          cd frontend
          npm ci
          PORTLYN_STATIC_EXPORT=1 npm run build
          rm -rf ../cmd/server/frontend_dist
          mv out ../cmd/server/frontend_dist
      - name: Build portlyn binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o portlyn ./cmd/server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portlyn-linux-amd64
          path: portlyn
          retention-days: 7
