name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_call:

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-vulns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Run govulncheck (SARIF)
        run: |
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          "$GOVULNCHECK" -format sarif ./... > govulncheck.sarif

      - name: Normalize SARIF for GitHub upload
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq '(.runs[]?.tool.driver.rules[]?.properties.tags) |= (if type=="array" then unique else . end)' \
              govulncheck.sarif > govulncheck.normalized.sarif
          else
            cp govulncheck.sarif govulncheck.normalized.sarif
          fi

      - name: Upload govulncheck SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: govulncheck.normalized.sarif
          category: govulncheck

      - name: Enforce govulncheck on main/schedule
        if: github.event_name != 'pull_request'
        run: |
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          "$GOVULNCHECK" ./...

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
