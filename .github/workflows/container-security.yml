name: Container Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 3"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server and nodeagent binaries for image
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/portlyn-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/portlyn-nodeagent-linux-amd64 ./cmd/nodeagent

      - name: Build backend image
        run: docker build --build-arg TARGETARCH=amd64 -t portlyn-backend:scan .

      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: portlyn-backend:scan
          artifact-name: sbom-backend.spdx.json
          format: spdx-json

      # Never fails, so the SARIF always reaches the security tab.
      - name: Run Trivy for backend image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portlyn-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload backend Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Gate backend image on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portlyn-backend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
